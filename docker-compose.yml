services:
  ai-status-monitor:
    build: .
    container_name: ai-status-monitor
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:3000"
    environment:
      PORT: "3000"
      CONFIG_FILE: "/app/config/providers.json"
      HISTORY_FILE: "/app/data/history.json"
      CHECK_POLL_INTERVAL_SECONDS: "${CHECK_POLL_INTERVAL_SECONDS:-60}"
      CHECK_CONCURRENCY: "${CHECK_CONCURRENCY:-5}"
      CHECK_TIMEOUT_MS: "${CHECK_TIMEOUT_MS:-45000}"
      DEGRADED_THRESHOLD_MS: "${DEGRADED_THRESHOLD_MS:-10000}"
      HISTORY_RETENTION_DAYS: "${HISTORY_RETENTION_DAYS:-30}"
      API_HISTORY_POINTS: "${API_HISTORY_POINTS:-91}"
      ALERT_CONSECUTIVE_FAILURES: "${ALERT_CONSECUTIVE_FAILURES:-3}"
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      TELEGRAM_MESSAGE_THREAD_ID: "${TELEGRAM_MESSAGE_THREAD_ID:-}"
      TELEGRAM_COMMANDS_ENABLED: "${TELEGRAM_COMMANDS_ENABLED:-true}"
      TELEGRAM_HISTORY_DEFAULT_HOURS: "${TELEGRAM_HISTORY_DEFAULT_HOURS:-24}"
      TELEGRAM_STATUS_URL: "${TELEGRAM_STATUS_URL:-}"
      TELEGRAM_SCREENSHOT_URL: "${TELEGRAM_SCREENSHOT_URL:-http://127.0.0.1:3000}"
      SHOW_OVERALL_ALERT: "${SHOW_OVERALL_ALERT:-false}"
      DEFAULT_GROUPS_EXPANDED: "${DEFAULT_GROUPS_EXPANDED:-true}"
      SITE_TITLE: "${SITE_TITLE:-AI Status Monitor}"
      SITE_BRAND: "${SITE_BRAND:-AI Status Monitor}"
      SITE_FOOTER_BRAND: "${SITE_FOOTER_BRAND:-AI Status Monitor}"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
